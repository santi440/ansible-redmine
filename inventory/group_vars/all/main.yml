---
redmine_version: "7.0.3"
redmine_ruby_version: "4.0.9"

redmine_user: redmine
redmine_group: redmine
redmine_home: /home/redmine
redmine_root: /opt/redmine

redmine_host_name: "127.0.0.1:8080"
redmine_http_port: 80

redmine_db_name: redmine
redmine_db_user: redmine
redmine_db_password: "{{ vault_redmine_db_password | default('') }}"
redmine_db_host: 127.0.0.1
redmine_db_port: 5432
redmine_db_allowed_cidrs:
  - 127.0.0.1/32
  - ::1/128

redmine_puma_workers: 2
redmine_puma_threads: 5

otel_enabled: true
otel_service_name: redmine
otel_exporter_endpoint: "http://127.0.0.1:4318"
otel_exporter_protocol: "http/protobuf"
otel_traces_exporter: otlp
otel_resource_attributes: "deployment.environment=demo,service.namespace=capacitacion"

otel_grafana_endpoint: "{{ vault_otel_grafana_endpoint | default('') }}"
otel_grafana_instance_id: "{{ vault_otel_grafana_instance_id | default('') }}"
otel_grafana_api_key: "{{ vault_otel_grafana_api_key | default('') }}"
