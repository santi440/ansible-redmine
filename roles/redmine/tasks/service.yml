---
- name: Escribir la unidad systemd de Redmine
  ansible.builtin.template:
    src: redmine.service.j2
    dest: /etc/systemd/system/redmine.service
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar Redmine

- name: Asegurar que Redmine esté activo al arrancar
  ansible.builtin.systemd_service:
    name: redmine
    state: started
    enabled: true
    daemon_reload: true

- name: Esperar a que Puma cree el socket
  ansible.builtin.wait_for:
    path: "{{ redmine_puma_socket }}"
    timeout: 120
    state: present
