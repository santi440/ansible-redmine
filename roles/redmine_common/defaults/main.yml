  - libgdbm-dev
  - libgmp-dev
  - libncurses-dev
  - libpq-dev
  - libreadline-dev
  - libssl-dev
  - libxml2-dev
  - libxslt1-dev
  - libyaml-dev
  - locales
  - logrotate
  - patch
  - pkg-config
  - python3-psycopg2
  - rsync
  - rustc
  - sudo
  - tzdata
  - uuid-dev
