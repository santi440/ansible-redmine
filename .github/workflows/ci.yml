---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configurar OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.2"
      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint
      - name: Instalar colecciones
        run: ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint
      - name: tofu fmt
        run: tofu fmt -check -recursive tofu
      - name: tofu init
        run: tofu -chdir=tofu init -backend=false
      - name: tofu validate
        run: tofu -chdir=tofu validate

  molecule:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint molecule molecule-plugins[docker]
      - name: Instalar colecciones
        run: ansible-galaxy collection install -r requirements.yml
      - name: Ejecutar Molecule
        run: molecule test
